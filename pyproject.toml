[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-bias-detector"
version = "0.1.0"
description = "Analytical linter identifying anchoring, availability bias, and sycophancy in LLM self-critique loops"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
cognitive-bias-detector = "cognitive_bias_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_bias_detector*"]
